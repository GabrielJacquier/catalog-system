services:
  catalog-consolidation:
    build: .
    volumes:
      - ./samples/catalog.db:/seed/catalog.db:ro
      - ./samples/seller-products.json:/input/seller-products.json:ro
      - .:/output
    command: ["--db", "/seed/catalog.db", "--input", "/input/seller-products.json", "--output", "/output/catalog-updated.db"]
